
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'MDTracker-v1.1.4.42-pc-grid-calibration*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/mdtracker"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/mdtracker"

      - name: Find latest successful vector catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow build-artwork-vector-catalog.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Successful vector catalog run not found"
            exit 1
          fi

          echo "VECTOR_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download vector catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vector"
          gh run download "$VECTOR_RUN_ID" \
            --name full-artwork-vector-catalog \
            --dir "$RUNNER_TEMP/vector"

          test -s "$RUNNER_TEMP/vector/artwork_vectors_v1.bin"

      - name: Install vector catalog
        run: |
          PROJECT="$RUNNER_TEMP/mdtracker"
          mkdir -p "$PROJECT/app/src/main/assets"

          cp "$RUNNER_TEMP/vector/artwork_vectors_v1.bin" \
            "$PROJECT/app/src/main/assets/artwork_vectors_v1.bin"

          test -s "$PROJECT/app/src/main/assets/artwork_manifest_index.json"
          test -s "$PROJECT/app/src/main/assets/artwork_vectors_v1.bin"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: ${{ runner.temp }}/mdtracker
        run: |
          gradle --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Tracker-debug-APK
          path: ${{ runner.temp }}/mdtracker/app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
